<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Campus Components</title>

<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f6f7fb;color:#172033}
header{background:#101828;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.logo{font-size:21px;font-weight:800}.logo span{color:#63b3ed}
nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer}
.primary{background:#2f80ed;color:#fff}.secondary{background:#eaf2ff;color:#1558a6}.danger{background:#fee4e2;color:#b42318}.dark{background:#344054;color:#fff}
.hero{padding:45px 5%;background:linear-gradient(135deg,#eaf3ff,#fff)}
.hero h1{font-size:38px;margin:0 0 10px}
.hero p{color:#667085;font-size:17px}
.container{padding:30px 5%}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d6dce5;border-radius:8px;background:white}
.toolbar input{max-width:500px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:white;border:1px solid #e5e9f0;border-radius:13px;overflow:hidden}
.pic{height:170px;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:55px}
.pic img{width:100%;height:100%;object-fit:cover}
.card-body{padding:15px}.card h3{margin:0 0 8px}.price{font-size:21px;font-weight:bold}
.meta{font-size:13px;color:#667085;line-height:1.7;margin:10px 0}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.small{padding:8px 10px;font-size:12px}
.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.green{background:#e9f8ef;color:#16834a}.orange{background:#fff4e5;color:#9a5b00}
.red{background:#fee4e2;color:#b42318}.purple{background:#f3e8ff;color:#7e22ce}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:100}
.box{background:white;width:min(600px,94%);max-height:92vh;overflow:auto;border-radius:14px;padding:22px}
.close{float:right;background:none;font-size:25px}
.form{display:grid;gap:11px}
footer{background:#101828;color:#cbd5e1;padding:30px 5%;margin-top:30px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style>
</head>

<body>

<header>
<div class="logo">Campus<span>Components</span></div>

<div id="status">Not logged in</div>

<nav>
<button class="secondary" id="loginBtn" onclick="openLogin()">Login</button>
<button class="primary" onclick="openSell()">+ Sell</button>
<button class="secondary" onclick="openProfile()">Profile</button>
</nav>
</header>

<section class="hero">
<h1>Buy & Sell Electronics Components on Campus</h1>
<p>Student marketplace for electronics components and college-use items.</p>
</section>

<section class="container">

<div class="toolbar">
<input id="search" placeholder="Search MQ2, Arduino, NRF24L01..." oninput="render()">

<select id="condition" onchange="render()">
<option value="">Any condition</option>
<option>New</option>
<option>Working</option>
</select>

<select id="location" onchange="render()">
<option value="">All locations</option>
</select>
</div>

<div id="grid" class="grid"></div>

</section>

<footer>
<b>CampusComponents</b><br><br>
Student electronics marketplace
</footer>


<!-- LOGIN -->

<div class="modal" id="loginModal">
<div class="box">

<button class="close" onclick="closeModal('loginModal')">×</button>

<h2 id="authTitle">Login</h2>

<form class="form" onsubmit="authSubmit(event)">

<input id="email" type="email" placeholder="Email" required>

<input id="password" type="password" minlength="6"
placeholder="Password" required>

<button class="primary" id="authButton">Login</button>

</form>

<br>

<button class="secondary" onclick="toggleAuth()" id="toggleButton">
Create Account
</button>

<p id="authMsg"></p>

</div>
</div>


<!-- SELL -->

<div class="modal" id="sellModal">
<div class="box">

<button class="close" onclick="closeModal('sellModal')">×</button>

<h2>Sell Component</h2>

<form class="form" onsubmit="saveListing(event)">

<input id="name" placeholder="Component name" required>

<input id="price" type="number" min="1"
placeholder="Price ₹" required>

<select id="cond" required>
<option value="">Condition</option>
<option>New</option>
<option>Working</option>
</select>

<input id="seller" placeholder="Seller name" required>

<input id="college" placeholder="College name" required>

<input id="collegeLocation"
placeholder="College location" required>

<input id="whatsapp" placeholder="WhatsApp">

<input id="instagram" placeholder="Instagram">

<input id="upi" placeholder="Your UPI ID">

<input id="image" type="file" accept="image/*"
onchange="readImage(event)">

<img id="preview"
style="display:none;width:100%;height:180px;object-fit:cover;border-radius:10px">

<textarea id="description"
placeholder="Description"></textarea>

<label>
<input type="checkbox" id="restricted">
 This item requires founder approval
</label>

<button class="primary">Publish Listing</button>

</form>

</div>
</div>


<!-- PROFILE -->

<div class="modal" id="profileModal">
<div class="box">

<button class="close" onclick="closeModal('profileModal')">×</button>

<h2>My Profile</h2>

<p id="profileEmail"></p>

<form class="form" onsubmit="saveProfile(event)">
<input id="profileUpi" placeholder="UPI ID">
<button class="primary">Save UPI ID</button>
</form>

<p id="profileMsg"></p>

<hr>

<h3>My Orders</h3>
<div id="myOrders"></div>

</div>
</div>


<!-- CONTACT -->

<div class="modal" id="contactModal">
<div class="box">

<button class="close" onclick="closeModal('contactModal')">×</button>

<h2>Contact Seller</h2>

<div id="contactInfo"></div>

</div>
</div>


<!-- FOUNDER -->

<div class="modal" id="founderModal">
<div class="box">

<button class="close" onclick="closeModal('founderModal')">×</button>

<h2>Founder Order Panel</h2>

<div id="founderOrders"></div>

</div>
</div>


<script type="module">

import {
initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
getDoc,
doc,
setDoc,
updateDoc,
query,
where,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==============================
   FIREBASE
============================== */

const firebaseConfig={
apiKey:"AIzaSyAkETZr4bZQRlLfpbHVlCdvwK7iub-gVmQ",
authDomain:"campus-components-2c641.firebaseapp.com",
projectId:"campus-components-2c641",
storageBucket:"campus-components-2c641.firebasestorage.app",
messagingSenderId:"174888026978",
appId:"1:174888026978:web:9170ceb1880bf9334f223b",
measurementId:"G-0JYEYHLHDC"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* ==============================
   CASHFREE PRODUCTION
============================== */

const cashfree=Cashfree({
mode:"production"
});


/* ==============================
   FOUNDER
============================== */

const FOUNDER_EMAIL="singhadarsh7254@gmail.com";


let listings=[];
let imageData="";
let signup=false;


/* ==============================
   AUTH
============================== */

window.openLogin=()=>{
document.getElementById("loginModal").style.display="flex";
};

window.closeModal=(id)=>{
document.getElementById(id).style.display="none";
};

window.toggleAuth=()=>{
signup=!signup;

document.getElementById("authTitle").textContent=
signup?"Create Account":"Login";

document.getElementById("authButton").textContent=
signup?"Create Account":"Login";

document.getElementById("toggleButton").textContent=
signup?"Already have account? Login":"Create Account";
};


window.authSubmit=async(e)=>{
e.preventDefault();

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const msg=document.getElementById("authMsg");

try{

if(signup){

await createUserWithEmailAndPassword(
auth,email,password
);

}else{

await signInWithEmailAndPassword(
auth,email,password
);

}

msg.textContent="Success";
msg.style.color="green";

setTimeout(()=>{
closeModal("loginModal");
},500);

}catch(err){

msg.textContent=err.message;
msg.style.color="red";

}

};


onAuthStateChanged(auth,async user=>{

const status=document.getElementById("status");
const btn=document.getElementById("loginBtn");

if(user){

status.textContent=
user.email===FOUNDER_EMAIL
?"Founder · "+user.email
:user.email;

btn.textContent="Logout";

btn.onclick=async()=>{
await signOut(auth);
};

}else{

status.textContent="Not logged in";
btn.textContent="Login";
btn.onclick=openLogin;

}

await loadListings();

});


/* ==============================
   IMAGE
============================== */

window.readImage=(e)=>{

const file=e.target.files[0];

if(!file)return;

if(file.size>700000){

alert("Image must be below 700 KB.");
e.target.value="";
return;

}

const reader=new FileReader();

reader.onload=()=>{
imageData=reader.result;

const preview=document.getElementById("preview");

preview.src=imageData;
preview.style.display="block";
};

reader.readAsDataURL(file);

};


/* ==============================
   SELL
============================== */

window.openSell=()=>{

if(!auth.currentUser){

alert("Please login first.");
openLogin();
return;

}

document.getElementById("sellModal").style.display="flex";

};


window.saveListing=async(e)=>{

e.preventDefault();

const user=auth.currentUser;

if(!user){

alert("Please login first.");
return;

}

const data={

name:document.getElementById("name").value.trim(),

price:Number(document.getElementById("price").value),

condition:document.getElementById("cond").value,

seller:document.getElementById("seller").value.trim(),

college:document.getElementById("college").value.trim(),

collegeLocation:
document.getElementById("collegeLocation").value.trim(),

whatsapp:
document.getElementById("whatsapp").value.trim(),

instagram:
document.getElementById("instagram").value.trim(),

image:imageData,

description:
document.getElementById("description").value.trim(),

restricted:
document.getElementById("restricted").checked,

approved:
!document.getElementById("restricted").checked,

ownerUid:user.uid,

ownerEmail:user.email,

sold:false,

buyerUid:"",

orderId:"",

createdAt:serverTimestamp()

};

try{

await addDoc(collection(db,"listings"),data);

alert("Listing published.");

imageData="";

document.querySelector("#sellModal form").reset();

document.getElementById("preview").style.display="none";

closeModal("sellModal");

await loadListings();

}catch(err){

alert(err.message);

}

};


/* ==============================
   LOAD LISTINGS
============================== */

async function loadListings(){

try{

const snap=await getDocs(
collection(db,"listings")
);

listings=[];

snap.forEach(d=>{
listings.push({
id:d.id,
...d.data()
});
});

updateLocations();
render();

}catch(err){

console.error(err);

}

}


/* ==============================
   RENDER
============================== */

window.render=()=>{

const grid=document.getElementById("grid");

grid.innerHTML="";

const search=
document.getElementById("search").value
.toLowerCase().trim();

const condition=
document.getElementById("condition").value;

const location=
document.getElementById("location").value;

let data=listings.filter(x=>{

const text=[
x.name,
x.description,
x.seller,
x.college,
x.collegeLocation,
x.condition
].join(" ").toLowerCase();

return text.includes(search)
&&(!condition||x.condition===condition)
&&(!location||x.collegeLocation===location);

});


data.forEach(x=>{

const founder=
auth.currentUser &&
auth.currentUser.email===FOUNDER_EMAIL;

if(x.restricted&&!x.approved&&!founder)return;

const card=document.createElement("div");
card.className="card";

let image=x.image
?`<img src="${esc(x.image)}">`
:`<span>📦</span>`;

let status="";

if(x.sold){

status=`<span class="badge red">SOLD OUT</span>`;

}else if(x.restricted&&!x.approved){

status=`<span class="badge orange">Pending Approval</span>`;

}else{

status=`<span class="badge green">Available</span>`;

}


let buttons="";

if(x.sold){

buttons+=`
<button class="secondary small"
onclick="contactSeller('${x.id}')">
Message Seller
</button>`;

if(
auth.currentUser &&
x.buyerUid===auth.currentUser.uid &&
x.deliveryConfirmed!==true
){

buttons+=`
<button class="primary small"
onclick="confirmDelivery('${x.id}')">
Delivery Done
</button>`;

}

}else{

buttons+=`
<button class="primary small"
onclick="buyNow('${x.id}')">
Buy Now
</button>`;

buttons+=`
<button class="secondary small"
onclick="contactSeller('${x.id}')">
Message Seller
</button>`;

}


if(
founder &&
x.restricted &&
!x.approved &&
!x.sold
){

buttons+=`
<button class="primary small"
onclick="approveListing('${x.id}')">
Approve
</button>`;

}


card.innerHTML=`

<div class="pic">${image}</div>

<div class="card-body">

<h3>${esc(x.name||"")}</h3>

<div class="price">
₹${Number(x.price||0).toLocaleString("en-IN")}
</div>

<div class="meta">

${esc(x.condition||"")}<br>
Seller: ${esc(x.seller||"")}<br>
🏫 ${esc(x.college||"")}<br>
📍 ${esc(x.collegeLocation||"")}<br><br>

${status}

</div>

<div class="actions">
${buttons}
</div>

</div>
`;

grid.appendChild(card);

});

};


/* ==============================
   LOCATIONS
============================== */

function updateLocations(){

const select=document.getElementById("location");

const values=[
...new Set(
listings
.map(x=>x.collegeLocation)
.filter(Boolean)
)
];

select.innerHTML=
`<option value="">All locations</option>`;

values.sort().forEach(x=>{

const o=document.createElement("option");

o.value=x;
o.textContent=x;

select.appendChild(o);

});

}


/* ==============================
   BUY NOW
============================== */

window.buyNow=async(id)=>{

/* LOGIN CHECK FIRST */

if(!auth.currentUser){

alert("Please login first to buy.");
openLogin();
return;

}

const listing=listings.find(x=>x.id===id);

if(!listing)return;

if(listing.sold){

alert("This component is already sold out.");
return;

}

if(
listing.restricted &&
!listing.approved
){

alert("This listing is waiting for founder approval.");
return;

}

if(
listing.ownerUid===auth.currentUser.uid
){

alert("You cannot buy your own component.");
return;

}


try{

/* CREATE CASHFREE ORDER */

const response=await fetch(
"/api/create-order",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

amount:Number(listing.price),

listingId:listing.id,

productName:listing.name,

buyerEmail:auth.currentUser.email,

buyerUid:auth.currentUser.uid,

sellerUid:listing.ownerUid

})

});

const data=await response.json();

if(!response.ok){

throw new Error(
data.error||"Order creation failed."
);

}

if(!data.paymentSessionId){

throw new Error(
"Payment session missing."
);

}


/* CASHFREE */

const result=await cashfree.checkout({

paymentSessionId:data.paymentSessionId,

redirectTarget:"_modal"

});

if(result?.error){

throw new Error(
result.error.message||
"Cashfree checkout failed."
);

}


/* VERIFY */

const verify=await fetch(
"/api/verify-payment",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
orderId:data.orderId
})

});

const verification=await verify.json();

if(!verify.ok||!verification.verified){

alert(
"Payment verification failed. Order ID: "+
data.orderId
);

return;

}


/* SAVE ORDER */

await addDoc(
collection(db,"orders"),
{

buyerUid:auth.currentUser.uid,

buyerEmail:auth.currentUser.email,

sellerUid:listing.ownerUid,

sellerEmail:listing.ownerEmail||"",

listingId:listing.id,

productName:listing.name,

amount:Number(listing.price),

cashfreeOrderId:data.orderId,

status:"paid",

deliveryConfirmed:false,

sellerPaid:false,

createdAt:serverTimestamp()

});


/* SOLD OUT */

await updateDoc(
doc(db,"listings",listing.id),
{

sold:true,

buyerUid:auth.currentUser.uid,

buyerEmail:auth.currentUser.email,

orderId:data.orderId,

soldAt:serverTimestamp(),

deliveryConfirmed:false

});


alert(
"Payment successful!\n\nComponent marked SOLD OUT."
);

await loadListings();

}catch(err){

console.error(err);

alert(
"Payment/Order Error:\n\n"+
err.message
);

}

};


/* ==============================
   CONTACT SELLER
============================== */

window.contactSeller=(id)=>{

const x=listings.find(a=>a.id===id);

if(!x)return;

let html=`

<b>${esc(x.name)}</b><br><br>

Seller: ${esc(x.seller)}<br>
College: ${esc(x.college)}<br>
Location: ${esc(x.collegeLocation)}

`;

if(x.whatsapp){

const number=
String(x.whatsapp).replace(/\D/g,"");

html+=`

<br><br>
<a target="_blank"
href="https://wa.me/${number}">
📱 Message on WhatsApp
</a>

`;

}

if(x.instagram){

const insta=
String(x.instagram).replace(/^@/,"");

html+=`

<br><br>
<a target="_blank"
href="https://instagram.com/${encodeURIComponent(insta)}">
📸 Instagram
</a>

`;

}

document.getElementById("contactInfo").innerHTML=html;

document.getElementById("contactModal").style.display="flex";

};


/* ==============================
   DELIVERY DONE
============================== */

window.confirmDelivery=async(id)=>{

if(!auth.currentUser){

alert("Please login first.");
return;

}

const listing=listings.find(x=>x.id===id);

if(!listing)return;

if(listing.buyerUid!==auth.currentUser.uid){

alert("Only the buyer can confirm delivery.");
return;

}

if(listing.deliveryConfirmed){

alert("Delivery already confirmed.");
return;

}

if(!confirm(
"Have you received the component?\n\nConfirm delivery?"
))return;

try{

await updateDoc(
doc(db,"listings",id),
{

deliveryConfirmed:true,

deliveryConfirmedAt:serverTimestamp()

});


const q=query(
collection(db,"orders"),
where("listingId","==",id),
where("buyerUid","==",auth.currentUser.uid)
);

const snap=await getDocs(q);

for(const d of snap.docs){

await updateDoc(
doc(db,"orders",d.id),
{

deliveryConfirmed:true,

deliveryConfirmedAt:serverTimestamp(),

status:"delivery_confirmed"

});

}

alert(
"Delivery confirmed.\n\nFounder can now pay the seller."
);

await loadListings();

}catch(err){

alert(err.message);

}

};


/* ==============================
   PROFILE
============================== */

window.openProfile=async()=>{

if(!auth.currentUser){

alert("Please login first.");
openLogin();
return;

}

document.getElementById("profileModal").style.display="flex";

document.getElementById("profileEmail").textContent=
auth.currentUser.email;

const ref=doc(
db,
"profiles",
auth.currentUser.uid
);

const snap=await getDoc(ref);

if(snap.exists()){

document.getElementById("profileUpi").value=
snap.data().upiId||"";

}

await loadMyOrders();

};


window.saveProfile=async(e)=>{

e.preventDefault();

if(!auth.currentUser)return;

const upi=document
.getElementById("profileUpi")
.value.trim();

if(!upi){

alert("Enter UPI ID.");
return;

}

try{

await setDoc(

doc(
db,
"profiles",
auth.currentUser.uid
),

{

upiId:upi,

email:auth.currentUser.email,

updatedAt:serverTimestamp()

},

{merge:true}

);

document.getElementById("profileMsg").textContent=
"UPI ID saved.";

}catch(err){

alert(err.message);

}

};


/* ==============================
   MY ORDERS
============================== */

async function loadMyOrders(){

const box=document.getElementById("myOrders");

box.innerHTML="Loading...";

const q=query(
collection(db,"orders"),
where("buyerUid","==",auth.currentUser.uid)
);

const snap=await getDocs(q);

box.innerHTML="";

if(snap.empty){

box.innerHTML="No orders.";

return;

}

snap.forEach(d=>{

const x=d.data();

box.innerHTML+=`

<div style="padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0">

<b>${esc(x.productName)}</b><br>

₹${x.amount}<br>

Status: ${esc(x.status)}

</div>

`;

});

}


/* ==============================
   FOUNDER APPROVE
============================== */

window.approveListing=async(id)=>{

if(!isFounder()){

alert("Founder only.");
return;

}

await updateDoc(
doc(db,"listings",id),
{

approved:true,

approvedBy:auth.currentUser.uid,

approvedAt:serverTimestamp()

});

alert("Listing approved.");

await loadListings();

};


/* ==============================
   HELPERS
============================== */

function isFounder(){

return auth.currentUser &&
auth.currentUser.email===FOUNDER_EMAIL;

}

function esc(s){

return String(s??"")
.replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m]));

}

</script>

</body>
</html>
